name: folkify_flutter
description: "Folkify - App học nhạc cụ dân tộc Việt Nam"
publish_to: "none"
version: 1.2.1+8

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  font_awesome_flutter: ^11.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  gal: ^2.3.0
  youtube_player_flutter: ^9.1.1
  in_app_purchase: 3.1.11
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  local_auth: ^2.3.0
  flutter_svg: ^2.0.17
  record: ^7.1.1
  file_picker: ^11.0.3
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/instruments/
    - assets/icons/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
